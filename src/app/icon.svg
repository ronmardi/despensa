<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo Noche Profunda -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" /> <!-- Indigo oscuro -->
      <stop offset="100%" stop-color="#020617" /> <!-- Slate profundo -->
    </linearGradient>

    <!-- Resplandor del Núcleo Raccoon (Cyan/Esmeralda) -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="1" />
      <stop offset="30%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>

    <!-- Paneles de Liquid Glass -->
    <linearGradient id="glassTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="glassLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="glassRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filtro para sombras 3D y resplandores -->
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- 1. Base del Icono (Forma de App de iOS) -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />
  
  <!-- 2. Aura difuminada trasera -->
  <circle cx="256" cy="260" r="140" fill="url(#coreGlow)" filter="url(#blur)" opacity="0.6" />

  <!-- 3. El Núcleo de Inventario (Esfera central) -->
  <circle cx="256" cy="230" r="55" fill="url(#coreGlow)" />
  <circle cx="236" cy="210" r="15" fill="#ffffff" opacity="0.7" filter="url(#softGlow)" />

  <!-- 4. Geometría del Cubo Isométrico (Cristal) -->
  <!-- Cara Izquierda (Púrpura Glass) -->
  <polygon points="126,200 256,275 256,425 126,350" fill="url(#glassLeft)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4" stroke-linejoin="round" />
  
  <!-- Cara Derecha (Azul Glass) -->
  <polygon points="386,200 256,275 256,425 386,350" fill="url(#glassRight)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4" stroke-linejoin="round" />
  
  <!-- Cara Superior (Tapa translúcida brillante) -->
  <polygon points="256,125 386,200 256,275 126,200" fill="url(#glassTop)" stroke="#ffffff" stroke-width="3" stroke-opacity="0.7" stroke-linejoin="round" />
  
  <!-- 5. Detalles de luz / Reflejos Holográficos -->
  <!-- Líneas de escaneo / inventario flotantes en el cristal -->
  <line x1="150" y1="230" x2="220" y2="270" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9" />
  <line x1="150" y1="265" x2="190" y2="288" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  <line x1="362" y1="230" x2="292" y2="270" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  
  <!-- Reflejo superior del cristal -->
  <polygon points="256,135 340,183 256,232 172,183" fill="#ffffff" opacity="0.15" />
</svg>
